name: test and deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # 커밋된 Firebase 묶음이 소스·버전과 같은지 확인
      - run: npm run build:firebase && git diff --exit-code js/vendor
      - run: npm test
      - run: npm run build:artifact
      # 사이트에 필요한 파일만 올립니다 (테스트·빌드 도구 제외)
      - name: Collect site files
        run: |
          mkdir _site
          cp -r index.html style.css sw.js manifest.webmanifest icons fonts js _site/
          node scripts/update-sw.mjs _site --hash
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
