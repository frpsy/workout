<!doctype html>
<html lang="ko" class="standalone">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Repday · 매일 운동 기록</title>
<meta name="description" content="한 세트부터 여러 운동 세션까지. 휴식 타이머와 운동시간, 하루의 꾸준함을 간편하게 기록하세요.">
<meta name="theme-color" content="#F2F7F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B100E" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Repday">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta property="og:site_name" content="Repday">
<meta property="og:title" content="Repday · 매일 운동 기록">
<meta property="og:description" content="운동을 한 세트씩, 세션별로 기록하는 나만의 운동 기록장">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="icons/icon-192.png" as="image" fetchpriority="high">
<link rel="preload" href="fonts/noto-sans-kr-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="modulepreload" href="js/vendor/firebase.js">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="splash" id="splash" role="status" aria-live="polite">
  <div class="splash-brand">
    <img src="icons/icon-192.png" width="88" height="88" alt="" class="splash-icon" decoding="sync">
    <svg class="splash-word" role="img" aria-label="Repday"><use href="#wordmark"/></svg>
  </div>
  <div class="splash-load">
    <div class="splash-track" id="splashTrack" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="splashBar"></i></div>
    <p class="splash-text" id="splashText">앱을 준비하는 중…</p>
    <button type="button" class="splash-retry" id="splashRetry" onclick="location.reload()">다시 시도</button>
  </div>
</div>
<main class="pager" id="pager">
  <div class="page" data-tab="today">
    <div class="wrap">
      <div id="today"></div>
      <div id="journal"></div>
      <div id="timer"></div>
      <div id="bottom">
        <div id="weather"></div>
        <div id="tip"></div>
      </div>
    </div>
  </div>
  <div class="page" data-tab="record">
    <div class="wrap">
      <h1 class="page-title" id="recordTitle">기록</h1>
      <p class="page-intro">하루하루 쌓이는 운동의 흐름</p>
      <div id="history" class="stack"></div>
      <div id="plan-sec"></div>
    </div>
  </div>
  <div class="page" data-tab="settings">
    <div class="wrap">
      <h1 class="page-title" id="settingsTitle">설정</h1>
      <p class="page-intro">나에게 맞는 운동과 목표 관리</p>
      <div id="settings" class="stack"></div>
    </div>
  </div>
  <noscript><p>이 페이지는 자바스크립트가 켜져 있어야 동작합니다.</p></noscript>
</main>
<nav class="tabbar" id="tabbar" aria-label="화면 선택">
  <i class="tab-ind" aria-hidden="true"></i>
  <button type="button" data-tab="today" aria-current="page">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/></svg>
    <span>오늘</span>
  </button>
  <button type="button" data-tab="record">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M8 3v4M16 3v4M4 10h16"/></svg>
    <span>기록</span>
  </button>
  <button type="button" data-tab="settings">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
    <span>설정</span>
  </button>
</nav>
