<!doctype html>
<html lang="ko" class="standalone">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rep Streak</title>
<meta name="description" content="푸시업, 풀업, 스쿼트를 매일 체크하고 주마다 목표를 늘려 가는 기록장">
<meta name="theme-color" content="#F1F4F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1613" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rep Streak">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/noto-sans-kr-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="modulepreload" href="js/vendor/firebase.js">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="splash" id="splash" role="status" aria-live="polite">
  <img src="icons/icon-192.png" width="84" height="84" alt="" class="splash-icon">
  <p class="splash-title">Rep Streak</p>
  <div class="splash-track" id="splashTrack" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="splashBar"></i></div>
  <p class="splash-text" id="splashText">앱을 준비하는 중…</p>
  <button type="button" class="splash-retry" id="splashRetry" onclick="location.reload()">다시 시도</button>
</div>
<main class="wrap">
  <div id="today"></div>
  <div id="timer"></div>
  <div id="bottom">
    <div id="weather"></div>
    <div id="tip"></div>
  </div>
  <h1 class="page-title" id="recordTitle" hidden>기록</h1>
  <div id="history" class="stack" hidden></div>
  <div id="plan-sec" hidden></div>
  <h1 class="page-title" id="settingsTitle" hidden>설정</h1>
  <div id="settings" class="stack" hidden></div>
  <noscript><p>이 페이지는 자바스크립트가 켜져 있어야 동작합니다.</p></noscript>
</main>
<nav class="tabbar" id="tabbar" aria-label="화면 선택">
  <button type="button" data-tab="today" aria-selected="true" aria-current="page">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/></svg>
    <span>오늘</span>
  </button>
  <button type="button" data-tab="record" aria-selected="false">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M8 3v4M16 3v4M4 10h16"/></svg>
    <span>기록</span>
  </button>
  <button type="button" data-tab="settings" aria-selected="false">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
    <span>설정</span>
  </button>
</nav>
<script type="module" src="js/main.js"></script>
</body>
</html>
